[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matterlab-discovery"
version = "0.1.0"
description = "Reproducible, local-first generation and physical screening of oxide material candidates"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["chgnet==0.4.2", "torch==2.6.0", "ase==3.26.0", "numpy==2.2.6", "scipy==1.17.1", "pymatgen==2025.6.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
matterlab = "matterlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
